<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кофейня "Уютный Уголок"</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #1a1a1a;
            color: #e8e6e3;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Звездный фон */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background-color: #6da584;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        
        .profile {
            margin: 30px 0 40px;
            padding: 25px;
            background: rgba(40, 40, 40, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(157, 107, 69, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid rgba(40, 40, 40, 0.8);
            overflow: hidden;
            background: linear-gradient(135deg, #6da584, #9d6b45);
        }
        
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #e8e6e3;
            font-weight: 600;
        }
        
        .description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 10px;
            color: #b8b2a8;
        }
        
        /* Кнопки */
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }
        
        .link-button {
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(157, 107, 69, 0.3);
            border-radius: 16px;
            padding: 18px 25px;
            color: #e8e6e3;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(109, 165, 132, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .link-button:hover::before {
            left: 100%;
        }
        
        .link-button:hover {
            background: rgba(50, 50, 50, 0.9);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }
        
        .link-button i {
            margin-right: 15px;
            font-size: 22px;
            width: 30px;
            text-align: center;
            color: #6da584;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #8a8478;
            padding: 20px;
            background: rgba(40, 40, 40, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(157, 107, 69, 0.3);
        }
        
        /* Адаптивность */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .description {
                font-size: 15px;
            }
            
            .link-button {
                padding: 16px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Звездный фон -->
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="profile">
            <div class="avatar">
                <img src="colourlogo.png&auto=format&fit=crop&w=300&q=80" alt="Кофейня Уютный Уголок" class="avatar-img">
            </div>
            <h1>Кофейня "Уютный Уголок"</h1>
            <p class="description">Насладитесь искусством кофе в уютной атмосфере. Свежие зерна и домашняя выпечка.</p>
            <p class="description">Место, где рождаются вкусные моменты.</p>
        </div>
        
        <!-- Кнопки -->
        <div class="links">
            <a href="#" class="link-button" id="menu-button">
                <i>📖</i> Наше меню
            </a>
            <a href="#" class="link-button" id="delivery-button">
                <i>🚴</i> Быстрая доставка
            </a>
            <a href="#" class="link-button" id="reservation-button">
                <i>🕒</i> Бронирование столика
            </a>
            <a href="#" class="link-button" id="reviews-button">
                <i>⭐</i> Отзывы гостей
            </a>
            <a href="#" class="link-button" id="contacts-button">
                <i>📍</i> Контакты
            </a>
        </div>
        
        <div class="footer">
            <p>© 2023 Кофейня "Уютный Уголок"</p>
            <p>Открыты с 7:00 до 22:00</p>
        </div>
    </div>

    <script>
        // Создание звездного фона
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 80;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Случайный размер звезды
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Случайная позиция
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // Случайная задержка анимации
                star.style.animationDelay = `${Math.random() * 3}s`;
                star.style.animationDuration = `${2 + Math.random() * 2}s`;
                
                // Случайный цвет из пастельной палитры
                const colors = ['#6da584', '#9d6b45', '#a8927a', '#7bb595'];
                star.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                starsContainer.appendChild(star);
            }
        }
        
        // Обработчики для кнопок
        function setupButtonHandlers() {
            document.getElementById('menu-button').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Переход к меню кофейни');
            });
            
            document.getElementById('delivery-button').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Переход к сервису доставки');
            });
            
            document.getElementById('reservation-button').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Переход к бронированию столика');
            });
            
            document.getElementById('reviews-button').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Переход к отзывам');
            });
            
            document.getElementById('contacts-button').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Переход к контактам');
            });
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            setupButtonHandlers();
        });
    </script>
</body>
</html>
