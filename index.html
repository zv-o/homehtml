<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кофейня Ocoffella</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background: #1a1a1a;
            color: #e8e6e3;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .profile {
            margin: 20px 0 30px;
            padding: 20px;
            background: #262626;
            border-radius: 16px;
            border: 1px solid #b17a50;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 3px solid #b17a50;
            overflow: hidden;
            background: #1C1C1C;
        }
        
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e8e6e3;
        }
        
        .description {
            font-size: 15px;
            color: #b8b2a8;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        .link-button {
            background: #262626;
            border: 1px solid #b17a50;
            border-radius: 12px;
            padding: 16px 20px;
            color: #e8e6e3;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        
        .link-button i {
            margin-right: 12px;
            color: #8ac09f;
        }
        
        .footer {
            font-size: 14px;
            color: #8a8478;
            padding: 15px;
            background: #262626;
            border-radius: 12px;
            border: 1px solid #b17a50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="avatar">
                <img src="colourlogo.png" alt="Кофейня Ocoffella" class="avatar-img">
            </div>
            <h1>Кофейня Ocoffella</h1>
            <p class="description">Спешалти кофейня в Испанских кварталах</p>
        </div>
        
        <div class="links">
            <a href="https://yandex.ru/maps/-/CHxK6PL1" class="link-button">
                <i>📖</i> Наше меню
            </a>
            <a href="https://ya.cc/t/ae-v2pWc4oHy7R" class="link-button">
                <i>⭐</i> Отзыв на Яндекс Карты
            </a>
            <a href="https://go.2gis.com/Wxb5s" class="link-button">
                <i>⭐</i> Отзыв на 2gis
            </a>
            <a href="https://t.me/ocoffella" class="link-button">
                <i>📢</i> Канал в Telegram
            </a>
            <a href="https://qr.nspk.ru/AS2A007POAK783NB9NPQJ1H5UANTL1DG?type=01&bank=100000000004&crc=2385" class="link-button">
                <i>💖</i> Оставить чаевые
            </a>
        </div>
        
        <div class="footer">
            <p>2025 Ocoffella</p>
        </div>
    </div>
</body>
</html>
